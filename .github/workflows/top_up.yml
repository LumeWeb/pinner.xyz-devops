name: Monitor Akash Deployments

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Monitor and Top Up Akash Deployments
        id: akash-topup
        uses: lumeweb/akash-topup-action@v0.1.10
        with:
          mnemonic: ${{ secrets.AKASH_WALLET_SEED }}
          cert-content: ${{ secrets.AKASH_CERT_CONTENT }}
          cert-id: ${{ secrets.AKASH_CERT_ID }}
          depositor-account: ${{ secrets.AKASH_DEPOSITOR_ACCOUNT }}
          fee-account: ${{ secrets.AKASH_FEE_ACCOUNT }}
          min-balance-threshold: "1.0"
          top-up-amount: "0.5"
        continue-on-error: true

      # Parse the summary to check for actual failures
      - name: Parse Summary
        id: parse-summary
        if: always()
        run: |
          if [ -z "${{ steps.akash-topup.outputs.summary }}" ]; then                                                                                                                                                                               
            echo "system_failure=true" >> $GITHUB_OUTPUT                                                                                                                                                                                           
            exit 0                                                                                                                                                                                                                                 
          fi                                                                                                                                                                                                                                       
          
          # Extract values from summary                                                                                                                                                                                                            
          FAILED_COUNT=$(echo '${{ steps.akash-topup.outputs.summary }}' | jq -r '.deployments.failed // 0')                                                                                                                                       
          FUNDED_COUNT=$(echo '${{ steps.akash-topup.outputs.summary }}' | jq -r '.deployments.funded // 0')                                                                                                                                       
          CHECKED_COUNT=$(echo '${{ steps.akash-topup.outputs.summary }}' | jq -r '.deployments.checked // 0')                                                                                                                                     
          
          # Only mark as failure if there were actual failures                                                                                                                                                                                     
          if [ "$FAILED_COUNT" -gt 0 ]; then                                                                                                                                                                                                       
            echo "has_failures=true" >> $GITHUB_OUTPUT                                                                                                                                                                                             
          fi                                                                                                                                                                                                                                       
          
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT                                                                                                                                                                                      
          echo "funded_count=$FUNDED_COUNT" >> $GITHUB_OUTPUT                                                                                                                                                                                      
          echo "checked_count=$CHECKED_COUNT" >> $GITHUB_OUTPUT
        shell: bash

      # Download Discord notifier
      - name: Download Discord Notifier
        id: download-notifier
        if: always()
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/appleboy/drone-discord/releases/latest)                                                                                                                                            
          VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed 's/^v//')                                                                                                                                                                     
          DOWNLOAD_URL="https://github.com/appleboy/drone-discord/releases/download/v${VERSION}/drone-discord-${VERSION}-linux-amd64"                                                                                                              
          curl -L -o discord-notifier "$DOWNLOAD_URL"                                                                                                                                                                                              
          chmod +x discord-notifier                                                                                                                                                                                                                

      # Send Discord notification only for actual failures
      - name: Discord Failure Notification
        if: steps.parse-summary.outputs.has_failures == 'true' || steps.parse-summary.outputs.system_failure == 'true'
        env:
          GITHUB: true
          WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          USERNAME: "Akash Monitor Bot"
          AVATAR_URL: "https://raw.githubusercontent.com/akash-network/website/master/src/assets/akash-logo-primary.svg"
          COLOR: "#FFA500"
          DISCORD_MESSAGE: |
            **:warning: Akash Top-up Alert: Issues Detected**                                                                                                                                                                                      
            
            **Repository:** ${{ github.repository }}
            **Deployments Checked:** ${{ steps.parse-summary.outputs.checked_count }}                                                                                                                                                              
            **Deployments Funded:** ${{ steps.parse-summary.outputs.funded_count }}                                                                                                                                                                
            **Total Funded:** ${{ steps.akash-topup.outputs.total_funded_akt }} AKT                                                                                                                                                                
            
            There were issues with the Akash top-up process.                                                                                                                                                                                       
            ${{ steps.parse-summary.outputs.system_failure == 'true' && 'System failure occurred.' || format('Failed to fund {0} deployments.', steps.parse-summary.outputs.failed_count) }}                                                       
            
            **Run ID:** ${{ github.run_id }}
        run: ./discord-notifier

      # Send successful notification ONLY when deployments are funded
      - name: Discord Success Notification
        if: steps.parse-summary.outputs.funded_count > '0'
        env:
          GITHUB: true
          WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          USERNAME: "Akash Monitor Bot"
          AVATAR_URL: "https://raw.githubusercontent.com/akash-network/website/master/src/assets/akash-logo-primary.svg"
          COLOR: "#00FF00"
          DISCORD_MESSAGE: |
            **:white_check_mark: Akash Deployment Top-up Successful**                                                                                                                                                                              
            
            **Deployments Checked:** ${{ steps.parse-summary.outputs.checked_count }}                                                                                                                                                              
            **Deployments Funded:** ${{ steps.parse-summary.outputs.funded_count }}                                                                                                                                                                
            **Total Funded:** ${{ steps.akash-topup.outputs.total_funded_akt }} AKT
        run: ./discord-notifier
